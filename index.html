<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iPhone: "Add to Home Screen" opens full-screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Bone Dry" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#12111d" />
  <title>Bone Dry</title>
  <link rel="stylesheet" href="style.css?v=31" />
</head>
<body>
  <div id="viewport">
    <div id="game" touch-action="none">

      <!-- ═══════════════════════════════════════════
           HOME — Figma 463:1564
      ═══════════════════════════════════════════ -->
      <div id="screen-home" class="screen active">
        <!-- Figma 527:141: logotype (flickering E), bottle row along the bottom, START SHIFT / HISTORY / DRINK MENU -->
        <img class="bd-logo home-logo" src="assets/logo-neon.svg?v=2" alt="Bone Dry" />
        <div id="home-bottles" aria-hidden="true">
          <img src="assets/ingredients-bd/soda-water.png" alt="" style="left:0px;top:21.093px;width:30.138px;height:76.138px" />
          <img src="assets/ingredients-bd/tequila.png" alt="" style="left:63.138px;top:23.805px;width:47.073px;height:73.426px" />
          <img src="assets/ingredients-bd/tonic-water.png" alt="" style="left:143.211px;top:37.887px;width:26.612px;height:59.344px" />
          <img src="assets/ingredients-bd/whiskey.png" alt="" style="left:202.823px;top:13.957px;width:35.477px;height:83.274px" />
          <img src="assets/ingredients-bd/cola.png" alt="" style="left:271.3px;top:51.760px;width:27.32px;height:45.471px" />
          <img src="assets/ingredients-bd/white-rum.png" alt="" style="left:331.62px;top:13.269px;width:32.549px;height:83.962px" />
          <img src="assets/ingredients-bd/gin.png" alt="" style="left:397.169px;top:13.000px;width:34.436px;height:84.231px" />
          <img src="assets/ingredients-bd/cranberry.png" alt="" style="left:464.605px;top:25.150px;width:36.974px;height:72.081px" />
          <img src="assets/ingredients-bd/oj.png" alt="" style="left:534.579px;top:33.648px;width:31.676px;height:63.583px" />
          <img src="assets/ingredients-bd/grenadine.png" alt="" style="left:599.255px;top:21.404px;width:36.796px;height:75.827px" />
          <img src="assets/ingredients-bd/triple-sec.png" alt="" style="left:669.051px;top:0.000px;width:29.667px;height:97.231px" />
          <img src="assets/ingredients-bd/simple-syrup.png" alt="" style="left:731.718px;top:16.409px;width:26.979px;height:80.822px" />
          <img src="assets/ingredients-bd/ginger-beer.png" alt="" style="left:791.697px;top:21.231px;width:22px;height:76px" />
          <img src="assets/ingredients-bd/lime-juice.png" alt="" style="left:846.697px;top:34.231px;width:22px;height:63px" />
        </div>
        <button id="btn-start-shift" class="btn-secondary">START SHIFT</button>
        <!-- History / Drink Menu / Settings screens are still to be designed -->
        <button id="btn-history" class="home-link">HISTORY</button>
        <button id="btn-drink-menu" class="home-link">DRINK MENU</button>
        <button id="btn-settings" aria-label="Settings"><img src="assets/ui/icon-settings.svg" alt="" /></button>
      </div>

      <!-- ═══════════════════════════════════════════
           DRINK MENU — Figma 559:427 (1428×619 frame, scaled to fit): a looping carousel
           of recipe cards — big card in the middle, faded smaller ones either side
      ═══════════════════════════════════════════ -->
      <div id="screen-menu" class="screen">
        <button id="btn-menu-home" class="pour-back">
          <img src="assets/ui/icon-back.svg" alt="" width="24" height="24" />
          <span>BACK TO HOME</span>
        </button>
        <div id="menu-carousel"></div>
        <button id="btn-menu-prev" class="menu-arrow prev" aria-label="Previous drink"><img src="assets/ui/menu-arrow-next.svg" alt="" /></button>
        <button id="btn-menu-next" class="menu-arrow" aria-label="Next drink"><img src="assets/ui/menu-arrow-next.svg" alt="" /></button>
      </div>

      <!-- ═══════════════════════════════════════════
           SCREEN 1: BAR OVERVIEW
      ═══════════════════════════════════════════ -->
      <div id="screen-bar" class="screen">
        <!-- Background + counter art come from ART in game.js (swap them there) -->
        <img class="bar-bg" id="bar-bg" alt="" />
        <!-- Customer slots (left / center / right) -->
        <div class="customer-slot" id="slot-0"></div>
        <div class="customer-slot" id="slot-1"></div>
        <div class="customer-slot" id="slot-2"></div>
        <!-- Counter -->
        <img class="counter" id="bar-counter" alt="" />
        <!-- Served drinks sit on the counter here -->
        <div id="counter-drinks"></div>
        <!-- Speech bubble -->
        <div id="speech-area" style="display:none;">
          <div id="speech-text"></div>
          <!-- Bubble shape + tail are drawn here (drawChalkBubble in game.js) -->
          <canvas id="speech-canvas" aria-hidden="true"></canvas>
        </div>
        <!-- Start order button -->
        <button id="btn-start-order" class="btn-primary" style="display:none;">START ORDER</button>
        <!-- Shown instead of START ORDER while a drink is in progress -->
        <button id="btn-back-to-pour" class="arrow-btn" style="display:none;">
          <span>POUR</span>
          <img class="flip" src="assets/ui/arrow-dark.svg" alt="" width="18" height="16" />
        </button>
        <!-- HUD -->
        <span id="bar-tips">$0.00</span>
        <button id="bar-pause" class="pause-btn" aria-label="Pause">
          <div class="pause-bar"></div>
          <div class="pause-bar"></div>
        </button>
      </div>

      <!-- ═══════════════════════════════════════════
           OVERLAY: RECIPE CARD
      ═══════════════════════════════════════════ -->
      <div id="overlay-recipe">
        <!-- Recipe card — Figma 502:1932. Moves up over a dim layer; close with the X or by tapping outside. -->
        <div id="recipe-backdrop"></div>
        <div id="recipe-card">
          <button id="btn-recipe-close" aria-label="Close recipe"><img src="assets/ui/icon-close.svg" alt="" /></button>
          <div id="recipe-title"></div>
          <img id="recipe-underline" src="assets/ui/recipe-underline.svg?v=2" alt="" />
          <div id="recipe-list"></div>
          <div id="recipe-drink-wrap"><div id="recipe-drink" class="drink-view"></div></div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════
           SCREEN 3: SHELF
      ═══════════════════════════════════════════ -->
      <div id="screen-shelf" class="screen">
        <!-- HUD -->
        <button id="btn-pour-out" class="shelf-pour-out">
          <img src="assets/ui/icon-restart.svg" alt="" width="24" height="24" />
          <span>&nbsp;POUR OUT</span>
        </button>
        <span id="shelf-title"></span>
        <!-- Peek at the recipe (familiar drinks only) — Figma 483:1650 -->
        <button id="btn-recipe-peek" class="recipe-peek" style="display:none;" aria-label="Recipe">
          <img src="assets/ui/icon-recipe.svg" alt="" width="21" height="21" />
        </button>
        <span id="shelf-timer" class="drink-timer">00:00</span>
        <button id="shelf-pause" class="pause-btn dim-pause" aria-label="Pause">
          <div class="pause-bar"></div>
          <div class="pause-bar"></div>
        </button>

        <!-- One swipeable row of bottles (order shuffles each round) -->
        <div id="shelf-row"></div>
        <img class="shelf-line" src="assets/ui/shelf-line.svg" alt="" />

        <!-- Bottom controls -->
        <button id="btn-to-bar" class="arrow-btn">
          <img src="assets/ui/arrow-bar.svg" alt="" width="18" height="16" />
          <span>BAR</span>
        </button>
        <button id="btn-pour" class="btn-secondary" style="display:none;">POUR</button>
        <div id="shelf-added" style="display:none;">
          <span id="shelf-added-text"></span>
          <img src="assets/ui/icon-check.svg" alt="" width="20" height="20" />
        </div>
        <button id="btn-to-garnish" class="arrow-btn" disabled>
          <span>GARNISH</span>
          <img class="flip" src="assets/ui/arrow-bar.svg" alt="" width="18" height="16" />
        </button>
      </div>

      <!-- ═══════════════════════════════════════════
           SCREEN 4: POUR SCREEN
      ═══════════════════════════════════════════ -->
      <div id="screen-pour" class="screen">
        <!-- Figma 512:97 "new design for pour" layout, plus DONE (user, 2026-09-28): BACK and DONE both save the pour -->
        <button id="btn-back-to-shelf" class="pour-back">
          <img src="assets/ui/icon-back.svg" alt="" width="24" height="24" />
          <span>BACK</span>
        </button>
        <span id="pour-timer" class="drink-timer pour-timer">00:00</span>
        <button id="btn-recipe-peek-pour" class="recipe-peek" style="display:none;" aria-label="Recipe">
          <img src="assets/ui/icon-recipe.svg" alt="" width="21" height="21" />
        </button>
        <button id="pour-pause" class="pause-btn light-pause" aria-label="Pause">
          <div class="pause-bar"></div>
          <div class="pause-bar"></div>
        </button>
        <div id="pour-instruction">HOLD ANYWHERE TO POUR</div>

        <img id="pour-glass" alt="" />
        <!-- One band per pour, clipped to the inside of the glass -->
        <div id="pour-liquid"></div>
        <img id="pour-ticks" src="assets/ui/pour-ticks.svg" alt="" width="211" height="64" />
        <span class="tick-label" data-oz="8">8 OZ</span>
        <span class="tick-label" data-oz="6">6 OZ</span>
        <span class="tick-label" data-oz="4">4 OZ</span>
        <span class="tick-label" data-oz="2.5">2.5 OZ</span>
        <span class="tick-label" data-oz="1.5">1.5 OZ</span>
        <img id="pour-bottle-img" src="" alt="" class="pour-bottle" />

        <!-- Two ways off this screen — BACK and DONE both save the pour -->
        <button id="btn-pour-done" class="btn-secondary">DONE</button>

      </div>

      <!-- ═══════════════════════════════════════════
           SCREEN 5: GARNISH — Figma 454:1119 / 454:1147 / 459:1230
      ═══════════════════════════════════════════ -->
      <div id="screen-garnish" class="screen">
        <button id="btn-remove-garnish" class="shelf-pour-out remove-garnish">
          <img src="assets/ui/icon-restart.svg" alt="" width="24" height="24" />
          <span>REMOVE GARNISH</span>
        </button>
        <span id="garnish-title"></span>
        <span id="garnish-timer" class="drink-timer pour-timer">00:00</span>
        <button id="btn-recipe-peek-garnish" class="recipe-peek" style="display:none;" aria-label="Recipe">
          <img src="assets/ui/icon-recipe.svg" alt="" width="21" height="21" />
        </button>
        <button id="garnish-pause" class="pause-btn light-pause" aria-label="Pause">
          <div class="pause-bar"></div>
          <div class="pause-bar"></div>
        </button>

        <img class="shelf-line" src="assets/ui/shelf-line.svg" alt="" />
        <!-- Glass + blended drink + placed garnishes -->
        <div id="garnish-drink" class="drink-view"></div>
        <!-- Garnish tray (built in game.js) -->
        <div id="garnish-tray"></div>
        <!-- Tap target appears once a garnish is selected -->
        <button id="garnish-target" style="display:none;" aria-label="Place garnish">
          <img class="tap-ripple" src="assets/ui/tap-target.png" alt="" />
          <img class="tap-ring" src="assets/ui/tap-target.png" alt="" />
        </button>

        <button id="btn-garnish-to-pour" class="arrow-btn">
          <img src="assets/ui/arrow-bar.svg" alt="" width="18" height="16" />
          <span>POUR</span>
        </button>
        <!-- Shows while dragging a garnish off the drink — drop it here to throw it away -->
        <img id="garnish-trash" src="assets/ui/icon-trash.svg" alt="Trash" style="display:none;" />
        <div id="garnish-toast" style="display:none;">
          <span id="garnish-toast-text"></span>
          <img src="assets/ui/icon-check.svg" alt="" width="20" height="20" />
        </div>
        <button id="btn-serve" class="arrow-btn">
          <span>SERVE</span>
          <img class="flip" src="assets/ui/arrow-bar.svg" alt="" width="18" height="16" />
        </button>
      </div>

      <!-- ═══════════════════════════════════════════
           SCREEN 5: SHIFT END
      ═══════════════════════════════════════════ -->
      <div id="screen-end" class="screen">
        <!-- Figma 568:497 "shift over" (1428×619, scaled ×0.591 + centered) -->
        <img id="end-skull" src="assets/ui/shift-over-skull.png" alt="" />
        <h1 id="end-title">SHI<span class="t-f">F</span>T <span class="t-o">O</span><span class="t-v">V</span>ER</h1>
        <p id="end-tips">Total tips: $0.00</p>
        <!-- Both buttons share one width so their sides line up -->
        <div class="end-buttons">
          <button id="btn-play-again" class="btn-primary">START OVER</button>
          <button id="btn-end-home" class="btn-secondary outline">BACK TO HOME</button>
        </div>
      </div>

      <!-- Peek confirm — Figma 509:88 "recipe peek confirmation" -->
      <div id="peek-confirm" style="display:none;">
        <div id="peek-confirm-box">
          <div class="peek-confirm-head">
            <img src="assets/ui/icon-recipe-confirm.svg" alt="" width="20" height="20" />
            <p id="peek-confirm-text"></p>
          </div>
          <div class="peek-confirm-row">
            <button id="btn-peek-no" class="btn-secondary peek-cancel">CANCEL</button>
            <button id="btn-peek-yes" class="btn-secondary peek-yes">YES</button>
          </div>
        </div>
      </div>

      <!-- Pause overlay -->
      <div id="pause-overlay" style="display:none;">
        <span>PAUSED</span>
        <!-- Tap anywhere else to resume -->
        <button id="btn-end-shift" class="btn-secondary">END SHIFT</button>
      </div>

      <!-- Notification layer -->
      <div id="notification-layer"></div>

    </div><!-- #game -->
  </div><!-- #viewport -->

  <script src="game.js?v=42"></script>
</body>
</html>
